#https://taskfile.dev/
version: '3'

tasks:

  tidy:
    desc: 'run Go mod tidy'
    cmds:
      - go mod tidy

  format:
    desc: 'formats the code'
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [GOFUMPT, BETTERALIGN]
    cmds:
      - go fix ./...
      - /{{.TMP}}/betteralign/{{.BETTERALIGN_VERSION}}/betteralign -apply ./... || true
      - /{{.TMP}}/gofumpt/{{.GOFUMPT_VERSION}}/gofumpt -extra -l -w .

  lint:
    desc: 'run Go linters'
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [STATICCHECK, BETTERALIGN, REVIVE]
    cmds:
      - go vet ./...
      - /{{.TMP}}/revive/{{.REVIVE_VERSION}}/revive -config revive.toml -formatter friendly -set_exit_status ./...
      - /{{.TMP}}/staticcheck/{{.STATICCHECK_VERSION}}/staticcheck ./...
      - /{{.TMP}}/betteralign/{{.BETTERALIGN_VERSION}}/betteralign ./...

  licenses:
    desc: 'check licenses'
    deps:
      - task: check-go-tool
        vars:
          TOOL: GO_LICENSES
    cmds:
      - |
          PROJECT="$(go list -m)"
          ALLOWED_LICENSES="$(<.allowed_license_types)"
          /{{.TMP}}/go-licenses/{{.GO_LICENSES_VERSION}}/go-licenses report --ignore "$PROJECT" --ignore "github.com/golang/freetype/raster" --ignore "github.com/golang/freetype/truetype" --ignore "oss.terrastruct.com/d2" .
          /{{.TMP}}/go-licenses/{{.GO_LICENSES_VERSION}}/go-licenses check --allowed_licenses="$ALLOWED_LICENSES" --ignore "$PROJECT"  --ignore "github.com/oktalz/present" --ignore "github.com/golang/freetype/raster" --ignore "github.com/golang/freetype/truetype" --ignore "oss.terrastruct.com/d2" .

  govulncheck:
    desc: 'check vulnerabilities in Go code'
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOVULNCHECK
    cmds:
      - /{{.TMP}}/govulncheck/{{.GOVULNCHECK_VERSION}}/govulncheck -show verbose ./...
